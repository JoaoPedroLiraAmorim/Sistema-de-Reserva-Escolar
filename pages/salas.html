<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salas - PROATEC</title>
    <meta name="description" content="Gestão e disponibilidade de salas reserváveis da escola.">

    <!-- Fontes do Google com display=block para prevenir FOUT de ícones -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">

    <!-- Folhas de Estilo -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/salas.css">

    <!-- Anti-flicker da Sidebar (Executado antes da renderização) -->
    <script>
        (function() {
            try {
                var saved = localStorage.getItem('escola_sidebar_collapsed');
                var isCollapsed = saved !== null ? saved === 'true' : true;
                if (!isCollapsed && window.innerWidth > 768) {
                    document.documentElement.classList.add('sidebar-expanded');
                } else {
                    document.documentElement.classList.add('sidebar-collapsed');
                }
            } catch(e) {}
        })();
    </script>
    <script src="../js/sidebar.js"></script>
</head>
<body data-page="salas">
    <div class="app-container">
        <!-- Sidebar injetada dinamicamente por sidebar.js -->
        <div id="sidebar-mount"></div>

        <!-- Área Principal -->
        <div class="main-wrapper">
            <main class="dashboard-content">
                <!-- Cabeçalho -->
                <section class="dashboard-header salas-page-header">
                    <div class="header-greeting">
                        <div class="header-top-row">
                            <p class="date-badge">—</p>
                        </div>
                        <h2>Gestão de Salas</h2>
                        <p>Ative ou desative salas. Salas inativas não aparecem em novas reservas.</p>
                    </div>
                    <button type="button" class="btn-primary btn-add-room" id="btnAddRoom">
                        <span class="material-symbols-outlined">add</span>
                        <span>Nova sala</span>
                    </button>
                </section>

                <div class="rooms-grid" id="rooms-grid"></div>
            </main>
        </div>
    </div>

    <!-- Modal: Adicionar Sala -->
    <div class="modal-backdrop hidden" id="add-room-modal">
        <div class="modal">
            <div class="modal-header">
                <div>
                    <h3>Adicionar Sala</h3>
                    <p>Cadastre uma nova sala para reservas.</p>
                </div>
                <button type="button" class="btn-close" aria-label="Fechar">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <form id="add-room-form">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="room-name-input">Nome da sala</label>
                        <input type="text" id="room-name-input" class="form-control" placeholder="Ex: Sala de Informática 01" required>
                    </div>
                    <div id="room-error" class="login-error-msg"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary btn-cancel-modal">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Container Toast -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Scripts Externos -->
    <script src="../js/store.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/salas.js"></script>
</body>
</html>

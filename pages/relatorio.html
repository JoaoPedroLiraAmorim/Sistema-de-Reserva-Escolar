<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios - PROATEC</title>
    <meta name="description" content="Relatório e registro de uso de equipamentos e salas por professor e turma.">

    <!-- Fontes do Google com display=block para prevenir FOUT de ícones -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">

    <!-- Folhas de Estilo -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/relatorio.css">

    <!-- Anti-flicker da Sidebar (Executado antes da renderização) -->
    <script>
        (function() {
            try {
                var saved = localStorage.getItem('escola_sidebar_collapsed');
                var isCollapsed = saved !== null ? saved === 'true' : true;
                if (!isCollapsed && window.innerWidth > 768) {
                    document.documentElement.classList.add('sidebar-expanded');
                } else {
                    document.documentElement.classList.add('sidebar-collapsed');
                }
            } catch(e) {}
        })();
    </script>
    <script src="../js/sidebar.js"></script>
</head>
<body data-page="relatorio">
    <div class="app-container">
        <!-- Sidebar injetada dinamicamente por sidebar.js -->
        <div id="sidebar-mount"></div>

        <!-- Área Principal -->
        <div class="main-wrapper">
            <main class="dashboard-content">
                <!-- Cabeçalho -->
                <header class="reports-page-header">
                    <div class="reports-title-group">
                        <div class="header-top-row">
                            <h2>Relatórios de Reservas</h2>
                        </div>
                        <p>Registro de uso de equipamentos por professor e turma.</p>
                    </div>

                    <!-- Filtros de exibição -->
                    <div class="reports-filter-group">
                        <div class="filter-pills" role="group" aria-label="Filtro de período">
                            <button type="button" class="btn-filter-pill active" id="btn-filter-all" onclick="RelatorioModule.setFilterMode('all')">
                                <span class="material-symbols-outlined">list_alt</span>
                                Todas as Reservas
                            </button>
                            <button type="button" class="btn-filter-pill" id="btn-filter-today" onclick="RelatorioModule.setFilterMode('today')">
                                <span class="material-symbols-outlined">today</span>
                                Hoje
                            </button>
                        </div>
                        <div class="filter-date-wrapper">
                            <input type="date" id="report-date" class="form-control report-date-input" title="Filtrar por data específica">
                        </div>
                        <div class="reports-date-badge" id="reports-date-badge">
                            <span class="material-symbols-outlined">calendar_month</span>
                            <span id="date-label">Todas as Reservas</span>
                        </div>
                    </div>
                </header>

                <!-- Resumo Estatístico -->
                <div id="report-stats" class="report-stats-grid"></div>

                <!-- Lista de Relatórios -->
                <section class="reports-list" id="reports-list"></section>
            </main>
        </div>
    </div>

    <!-- Modal: Registros de Notebooks e Alunos da Reserva -->
    <div class="modal-backdrop hidden" id="records-modal" role="dialog" aria-modal="true" aria-labelledby="records-modal-title">
        <div class="modal modal-records">
            <div class="modal-header">
                <div class="modal-title-wrap">
                    <div class="modal-icon-badge">
                        <span class="material-symbols-outlined">assignment</span>
                    </div>
                    <div>
                        <h3 id="records-modal-title">Registros da Reserva</h3>
                        <p id="records-modal-subtitle">Equipamentos e alunos vinculados pelo professor</p>
                    </div>
                </div>
                <button type="button" class="btn-close" onclick="RelatorioModule.closeRecordsModal()" aria-label="Fechar">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>

            <div class="modal-body">
                <!-- Informações Resumidas da Reserva -->
                <div class="records-res-info" id="records-res-info"></div>

                <!-- Tabela de Registros -->
                <div class="records-table-container" id="records-table-container"></div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="RelatorioModule.closeRecordsModal()">Fechar</button>
            </div>
        </div>
    </div>

    <!-- Container Toast -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Scripts Externos -->
    <script src="../js/store.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/relatorio.js"></script>
</body>
</html>

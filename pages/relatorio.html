<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios - PROATEC</title>
    <meta name="description" content="Relatório e registro de uso de equipamentos e salas por professor e turma.">

    <!-- Fontes do Google com display=block para prevenir FOUT de ícones -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">

    <!-- Folhas de Estilo -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/relatorio.css">

    <!-- Anti-flicker da Sidebar (Executado antes da renderização) -->
    <script>
        (function() {
            try {
                var saved = localStorage.getItem('escola_sidebar_collapsed');
                var isCollapsed = saved !== null ? saved === 'true' : true;
                if (!isCollapsed && window.innerWidth > 768) {
                    document.documentElement.classList.add('sidebar-expanded');
                } else {
                    document.documentElement.classList.add('sidebar-collapsed');
                }
            } catch(e) {}
        })();
    </script>
    <script src="../js/sidebar.js"></script>
</head>
<body data-page="relatorio">
    <div class="app-container">
        <!-- Sidebar injetada dinamicamente por sidebar.js -->
        <div id="sidebar-mount"></div>

        <!-- Área Principal -->
        <div class="main-wrapper">
            <main class="dashboard-content">
                <!-- Cabeçalho -->
                <header class="reports-page-header">
                    <div class="reports-title-group">
                        <div class="header-top-row">
                            <h2>Relatórios de Reservas</h2>
                        </div>
                        <p>Registro de uso de equipamentos por professor e turma.</p>
                    </div>

                    <!-- Filtro por data -->
                    <div class="reports-filter-group">
                        <input type="date" id="report-date" class="form-control report-date-input">
                        <div class="reports-date-badge">
                            <span class="material-symbols-outlined">calendar_month</span>
                            <span id="date-label">Hoje</span>
                        </div>
                    </div>
                </header>

                <!-- Resumo Estatístico -->
                <div id="report-stats" class="report-stats-grid"></div>

                <!-- Lista de Relatórios -->
                <section class="reports-list" id="reports-list"></section>
            </main>
        </div>
    </div>

    <!-- Container Toast -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Scripts Externos -->
    <script src="../js/store.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/relatorio.js"></script>
</body>
</html>

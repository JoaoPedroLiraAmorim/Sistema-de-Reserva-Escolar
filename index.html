<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduLab Reserve</title>
    <meta name="description" content="Sistema de reserva de laboratórios e notebooks escolares. Faça login para acessar.">
    <!-- Fonte do Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Folhas de Estilo Modularizadas -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="container">
        <!-- Lado Esquerdo (60% Imagem) -->
        <div class="left-side">
            <img src="imagens/ChatGPT Image 31 de ago. de 2026, 21_40_12.png" alt="Sistema de Agendamento" class="hero-image" />
        </div>

        <!-- Lado Direito (40% Formulário de Login) -->
        <div class="right-side">
            <div class="login-box">
                <div class="login-header">
                    <h2>Acesse sua conta</h2>
                    <p>Informe seu e-mail institucional e senha para continuar.</p>
                </div>

                <form id="login-form" novalidate>
                    <!-- E-mail Input -->
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <div class="input-wrapper">
                            <svg class="icon-left" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                            </svg>
                            <input type="email" id="email" placeholder="seu@email.com" autocomplete="username" required>
                        </div>
                    </div>

                    <!-- Senha Input -->
                    <div class="form-group">
                        <label for="password">Senha</label>
                        <div class="input-wrapper">
                            <svg class="icon-left" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                            <input type="password" id="password" placeholder="Digite sua senha" autocomplete="current-password" required>
                            <svg class="icon-right" id="togglePassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" title="Mostrar/Ocultar senha">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </div>
                    </div>

                    <!-- Mensagem de Erro -->
                    <div id="login-error" class="login-error-msg" style="display:none;"></div>

                    <button type="submit" class="btn-primary" id="btn-login">Entrar</button>

                    <!-- Credenciais de demonstração -->
                    <div class="demo-credentials">
                        <p class="demo-title">Credenciais de demonstração:</p>
                        <div class="demo-pills">
                            <button type="button" class="demo-pill" data-email="professor@demo.com" data-pass="123456">
                                <span>👨‍🏫 Professor</span>
                            </button>
                            <button type="button" class="demo-pill" data-email="proatec@demo.com" data-pass="123456">
                                <span>🖥️ PROATEC</span>
                            </button>
                            <button type="button" class="demo-pill" data-email="coordenacao@demo.com" data-pass="123456">
                                <span>🏫 Coordenação</span>
                            </button>
                        </div>
                    </div>
                </form>

                <div class="footer-text">
                    Dúvidas? Fale com o <a href="#">suporte da escola.</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Store (dados e lógica) -->
    <script src="js/store.js"></script>
    <script>
        // Se já está logado, redirecionar direto
        (function () {
            const session = ERS.getSession();
            if (session) {
                const map = { professor: 'pages/professor.html', proatec: 'pages/proatec.html', coordenacao: 'pages/proatec.html' };
                window.location.href = map[session.role] || 'pages/professor.html';
            }
        })();

        // Toggle de senha
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                togglePassword.style.color = type === 'text' ? 'var(--color-primary)' : '';
            });
        }

        // Preencher credenciais ao clicar nas pills de demonstração
        document.querySelectorAll('.demo-pill').forEach(pill => {
            pill.addEventListener('click', () => {
                document.getElementById('email').value = pill.dataset.email;
                document.getElementById('password').value = pill.dataset.pass;
                document.getElementById('login-error').style.display = 'none';
            });
        });

        // Submit do formulário de login
        document.getElementById('login-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('login-error');
            const btnLogin = document.getElementById('btn-login');

            errorEl.style.display = 'none';
            btnLogin.textContent = 'Entrando...';
            btnLogin.disabled = true;

            setTimeout(() => {
                const result = ERS.login(email, password);
                if (result.ok) {
                    const map = {
                        professor:   'pages/professor.html',
                        proatec:     'pages/proatec.html',
                        coordenacao: 'pages/proatec.html',
                    };
                    window.location.href = map[result.user.role] || 'pages/professor.html';
                } else {
                    errorEl.textContent = result.message;
                    errorEl.style.display = 'block';
                    btnLogin.textContent = 'Entrar';
                    btnLogin.disabled = false;
                }
            }, 400); // Pequeno delay para feedback visual
        });
    </script>
</body>
</html>

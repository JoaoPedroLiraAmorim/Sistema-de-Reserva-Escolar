<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduLab Reserve</title>
    <meta name="description" content="Sistema de reserva de laboratórios e notebooks escolares. Faça login para acessar.">

    <!-- Fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Folhas de Estilo -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="container">
        <!-- Lado Esquerdo (Imagem) -->
        <div class="left-side">
            <img src="imagens/ChatGPT Image 31 de ago. de 2026, 21_40_12.png" alt="Sistema de Agendamento" class="hero-image">
        </div>

        <!-- Lado Direito (Formulário) -->
        <div class="right-side">
            <div class="login-box">
                <div class="login-header">
                    <h2>Acesse sua conta</h2>
                    <p>Informe seu e-mail institucional e senha para continuar.</p>
                </div>

                <form id="login-form" novalidate>
                    <!-- E-mail -->
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <div class="input-wrapper">
                            <svg class="icon-left" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                            </svg>
                            <input type="email" id="email" placeholder="seu@email.com" autocomplete="username" required>
                        </div>
                    </div>

                    <!-- Senha -->
                    <div class="form-group">
                        <label for="password">Senha</label>
                        <div class="input-wrapper">
                            <svg class="icon-left" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                            <input type="password" id="password" placeholder="Digite sua senha" autocomplete="current-password" required>
                            <svg class="icon-right" id="togglePassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" title="Mostrar/Ocultar senha">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </div>
                    </div>

                    <!-- Mensagem de Erro -->
                    <div id="login-error" class="login-error-msg"></div>

                    <button type="submit" class="btn-primary" id="btn-login">Entrar</button>

                    <!-- Credenciais de Demonstração -->
                    <div class="demo-credentials">
                        <p class="demo-title">Credenciais de demonstração:</p>
                        <div class="demo-pills">
                            <button type="button" class="demo-pill" data-email="professor@demo.com" data-pass="123456">
                                <span>👨‍🏫 Professor</span>
                            </button>
                            <button type="button" class="demo-pill" data-email="proatec@demo.com" data-pass="123456">
                                <span>🖥️ PROATEC</span>
                            </button>
                            <button type="button" class="demo-pill" data-email="coordenacao@demo.com" data-pass="123456">
                                <span>🏫 Coordenação</span>
                            </button>
                        </div>
                    </div>
                </form>

                <div class="footer-text">
                    Dúvidas? Fale com o <a href="#">suporte da escola.</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts Externos -->
    <script src="js/store.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
